<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="app-layout">
      <!-- Left: 40% Add Task Panel -->
      <section class="form-panel">
        <h1>To-Do List</h1>
        <p class="subtitle">Stay organized. Get things done.</p>

        <h2>Add a New Task</h2>

        <form id="todo-form">
          <input
            id="title"
            type="text"
            placeholder="Enter task title..."
            required
          />

          <textarea
            id="description"
            placeholder="Add a description (optional)..."
          ></textarea>

          <button id="submit-button" type="submit">Add Task</button>
        </form>

        <p id="status-message" role="status" aria-live="polite"></p>
      </section>

      <!-- Right: 60% Task Grid -->
      <section class="tasks-panel">
        <h2>My Tasks</h2>

        <p id="empty-message">No to-dos yet. Add your first task!</p>

        <ul id="todo-list"></ul>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
